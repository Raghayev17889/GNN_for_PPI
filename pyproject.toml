[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = [
    "error::FutureWarning",
    # Raised inside PyTorch Geometric on import with recent PyTorch releases.
    "ignore:`torch.jit.script` is deprecated:FutureWarning",
    "ignore:Failing to pass a value to the 'type_params' parameter:DeprecationWarning",
]
