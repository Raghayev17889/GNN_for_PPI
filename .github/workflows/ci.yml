name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt
      - name: Run tests
        run: pytest
      - name: Smoke-test the pipeline on the bundled synthetic sample
        run: >
          python src/model.py --input data/raw/sample_ppi_edges.tsv --cv-folds 2
          --betweenness-samples 200 --importance-repeats 2 --top-novel 10 --output-dir results/ci-synthetic
      - name: Download, preprocess and model a real interactome (HI-III)
        run: |
          python src/datasets.py download hi-iii genes-human
          python src/preprocessing.py --dataset hi-iii
          python src/model.py --dataset hi-iii --cv-folds 2 --betweenness-samples 200 \
            --importance-repeats 2 --top-novel 10 --output-dir results/ci-hi-iii
